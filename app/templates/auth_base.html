{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autenticação{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #f3f4f6;
            color: #2c3e50;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #f8f8f8;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(15, 43, 69, 0.08);
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-brasoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .login-brasoes img {
            max-height: 58px;
            width: auto;
            object-fit: contain;
        }

        .login-card h2 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f2b45;
            margin-bottom: 4px;
        }

        .login-card .login-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #7f8c97;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .login-card form table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .login-card form table th {
            text-align: left;
            font-size: 0.82rem;
            font-weight: 600;
            color: #2c3e50;
            padding-bottom: 4px;
            padding-right: 12px;
            white-space: nowrap;
            vertical-align: top;
            padding-top: 10px;
        }

        .login-card form table td {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .login-card form table input[type="text"],
        .login-card form table input[type="password"],
        .login-card form table input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d0dce8;
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ece7b5;
            color: #2c3e50;
        }

        .login-card form table input[type="text"]:focus,
        .login-card form table input[type="password"]:focus,
        .login-card form table input[type="email"]:focus {
            border-color: #4fc3f7;
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
            background: #ece7b5;
        }

        .login-card form input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a4971, #0f2b45);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(15, 43, 69, 0.25);
            letter-spacing: 0.3px;
        }

        .login-card form input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(15, 43, 69, 0.35);
            background: linear-gradient(135deg, #2196F3, #1a4971);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.82rem;
            color: #7f8c97;
        }

        .login-footer a {
            color: #1a4971;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .login-card .errorlist {
            list-style: none;
            padding: 0;
            margin: 8px 0 12px;
        }

        .login-card .errorlist li {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            border-left: 3px solid #dc2626;
            margin-bottom: 6px;
            line-height: 1.45;
        }

        .login-card .helptext {
            display: block;
            margin-top: 8px;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: #fef2f2;
            color: #dc2626;
            border-left: 3px solid #dc2626;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.5;
            width: 100%;
        }

        .login-card .helptext ul {
            margin: 0;
            padding-left: 18px;
        }

        .login-card .helptext ul li {
            margin-bottom: 4px;
            background: none;
            border: none;
            padding: 0;
            color: #dc2626;
            border-radius: 0;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .login-card .helptext ul li:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
            }

            .login-brasoes {
                gap: 12px;
            }

            .login-brasoes img {
                max-height: 48px;
            }

            .login-card form table,
            .login-card form table tbody,
            .login-card form table tr,
            .login-card form table th,
            .login-card form table td {
                display: block;
                width: 100%;
            }

            .login-card form table th {
                padding-top: 0;
                padding-bottom: 6px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-page">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
